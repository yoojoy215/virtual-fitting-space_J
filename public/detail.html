<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fitting Space | AI Try-On</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-nav">
        <div class="nav-left">
            <a href="studio.html" class="nav-btn-studio">AI FITTING STUDIO</a>
        </div>
        <div class="nav-right">
            <div class="search-container"><input type="text" class="search-input" placeholder="SEARCH"></div>
            <a href="#" class="nav-text-btn">FAVORITES</a>
            <a href="#" class="nav-text-btn">LOG IN</a>
        </div>
    </nav>

    <header style="padding: 60px 0 30px 0;">
        <a href="index.html" class="logo" style="font-size: 50px;">Fitting Space</a>
    </header>

    <div class="wrapper">
        <aside class="sidebar">
            <div class="menu-item-container"><a href="#" class="menu-item">MEN</a></div>
            <div class="menu-item-container"><a href="#" class="menu-item">WOMEN</a></div>
        </aside>

        <main class="main-content">
            <div class="detail-container">
                <div class="product-detail-left">
                    <img id="detailMainImg" src="" alt="Product" style="width:100%; border:1px solid #eee;">
                    <div class="title-row" style="margin-bottom: 5px;">
                        <h2 id="detailTitle" style="font-family:var(--font-logo); font-size:28px; margin:0;"></h2>
                        <span class="favorite-btn" onclick="toggleHeart(this)">♡</span>
                    </div>
                    <p id="detailPrice" style="color:#888; letter-spacing:1px; margin: 0 0 5px 0;"></p>
                    <p id="detailCode" style="font-size:11px; color:#333; font-weight:700; letter-spacing:1px; margin:0;"></p>
                </div>
                
                <div class="fitting-panel-right">
                    <div class="fitting-header">
                        <h3>AI VIRTUAL TRY-ON <span style="font-size:11px; float:right; cursor:pointer;">Guide</span></h3>
                    </div>
                    
                    <button class="btn-sub" style="width:100%; margin-bottom:15px;" onclick="document.getElementById('photoUpload').click()">📷 UPLOAD PHOTO</button>
                    <input type="file" id="photoUpload" hidden accept="image/*" onchange="previewUpload(this)">

                    <div id="outputZone" class="upload-zone">
                        <p style="font-size:11px; color:#888;">Your virtual fit will appear here</p>
                    </div>

                    <div class="control-group">
                        <div class="control-label"><span>Horizontal Rotation</span><span id="horizVal">0°</span></div>
                        <input type="range" min="-180" max="180" value="0" oninput="document.getElementById('horizVal').innerText = this.value + '°'">
                    </div>
                    <div class="control-group">
                        <div class="control-label"><span>Vertical Tilt</span><span id="vertVal">0°</span></div>
                        <input type="range" min="-180" max="180" value="0" oninput="document.getElementById('vertVal').innerText = this.value + '°'">
                    </div>

                    <div class="action-btns">
                        <button class="btn-main" style="grid-column: span 2;" onclick="generateTryOn()">GENERATE AI FITTING</button>
                        <button class="btn-sub">SAVE</button>
                        <button class="btn-sub">SHARE</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
