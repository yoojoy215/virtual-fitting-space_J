<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fitting Space | AI Virtual Fitting</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-nav">
        <div class="nav-left">
            <a href="studio.html" class="nav-btn-studio">FitStream</a>
        </div>
        <div class="nav-right">
            <div class="search-container">
                <input type="text" class="search-input" placeholder="SEARCH">
            </div>
            <a href="#" class="nav-text-btn">FAVORITES</a>
            <a href="#" class="nav-text-btn" onclick="openLoginModal()">LOG IN</a>
        </div>
    </nav>

    <header>
        <a href="index.html" class="logo">Fitting Space</a>
    </header>

    <div class="wrapper">
        <aside class="sidebar">
            <div class="menu-item-container"><a href="#" class="menu-item" onclick="renderProducts('all')">ALL</a></div>
            <div class="menu-item-container"><a href="#" class="menu-item" onclick="renderProducts('upper')">UPPER (상의)</a></div>
            <div class="menu-item-container"><a href="#" class="menu-item" onclick="renderProducts('bottom')">BOTTOM (하의)</a></div>
            <div class="menu-item-container"><a href="#" class="menu-item" onclick="renderProducts('overall')">OVERALL (한벌옷)</a></div>
        </aside>
        <main class="main-content">
            <div class="product-grid"></div>
        </main>
    </div>

    <div class="chatbot-container">
        <div class="chatbot-icon" onclick="toggleChatbot()">FitMate</div>
        <div class="chat-window" id="chatWindow">
            <div class="chat-header">
                <span>FitMate AI Support</span>
                <div>
                    <span onclick="expandChatbot()" style="cursor:pointer; margin-right:10px;" title="크게 보기">⛶</span>
                    <span onclick="toggleChatbot()" style="cursor:pointer;" title="닫기">✖</span>
                </div>
            </div>
            <div class="chat-messages">
                <p><strong>FitMate:</strong> 안녕하세요! 패션 AI 어시스턴트입니다. 오늘 어떤 스타일을 도와드릴까요?</p>
            </div>
            <div class="quick-replies">
                <button class="quick-btn">내 체형에 맞는 원피스 추천해줘</button>
                <button class="quick-btn">이 사진이랑 비슷한 옷 찾아줘</button>
            </div>
            <div class="chat-input">
                <label for="chatFile" class="chat-upload-label" title="사진 업로드">📎</label>
                <input type="file" id="chatFile" hidden accept="image/*">
                <input type="text" placeholder="메시지를 입력하세요...">
                <button class="chat-send-btn">전송</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
